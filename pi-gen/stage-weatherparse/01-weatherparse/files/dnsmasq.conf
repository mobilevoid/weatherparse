# WeatherParse hub link (2026-10-25). dnsmasq serves ONLY the wired port to the AcuRite Access (end0).
# The Pi itself uses normal DNS over Wi-Fi (NetworkManager, router first), so it sees the real AcuRite address.
interface=end0
except-interface=lo
bind-interfaces
no-dhcp-interface=wlan0
dhcp-range=end0,192.168.6.50,192.168.6.100,255.255.255.0,24h

# Hub lookups: the AcuRite upload host points at this Pi (hub side); everything else goes to public DNS.
no-hosts
no-resolv
server=8.8.8.8
server=1.1.1.1
address=/atlasapi.myacurite.com/192.168.6.1
