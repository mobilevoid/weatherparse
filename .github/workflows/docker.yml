name: docker

# Builds the WeatherParse image for PCs (amd64) and Raspberry Pi (arm64), smoke-tests it with a throwaway
# database, and publishes it to ghcr.io only after the test passes (main branch: tag "edge"; releases: version tags).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (amd64)
        run: docker build -t weatherparse:test .

      - name: Start a throwaway database and the container
        run: |
          docker network create wp
          docker run -d --name db --network wp \
            -e MARIADB_ROOT_PASSWORD=ci-root-pass -e MARIADB_DATABASE=weatherparse \
            -e MARIADB_USER=weatherparse -e MARIADB_PASSWORD=ci-pass mariadb:11
          docker run -d --name wp --network wp -p 8080:80 -p 8443:443 \
            -e TZ=Etc/UTC -e MYSQL_HOSTNAME=db -e MYSQL_DATABASE=weatherparse \
            -e MYSQL_USER=weatherparse -e MYSQL_PASSWORD=ci-pass -e MYSQL_ROOT_PASSWORD=ci-root-pass \
            weatherparse:test
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = 200 ] || [ "$code" = 302 ] && break
            sleep 2
          done
          echo "HTTP status: $code"
          docker logs wp | tail -40
          [ "$code" = 200 ] || [ "$code" = 302 ]

      - name: Check the running container
        run: |
          set -e
          curl -sk -o /dev/null -w 'HTTPS status: %{http_code}\n' https://localhost:8443/
          docker exec wp php -v | head -1 | grep -q 'PHP 8.4'
          docker exec wp php -l /opt/weatherparse/src/inc/loader.php
          # The AcuRite Access needs TLS 1.1 allowed
          docker exec wp grep -A2 '^\[system_default_sect\]' /etc/ssl/openssl.cnf | grep -q 'MinProtocol = TLSv1.1'
          # Camera tools and scripts are in the image
          docker exec wp sh -c 'command -v ffmpeg && command -v convert && command -v wget && test -f /opt/weatherparse/cam/webcam && test -f /opt/weatherparse/cam/templates/config.env'
          docker exec wp crontab -l
          # No local settings or images were baked in
          docker exec wp sh -c 'test ! -e /opt/weatherparse/src/usr/config.php && test ! -e /opt/weatherparse/cam/config.env'
          # The web installer page loads without PHP errors
          page=$(curl -sL http://localhost:8080/)
          echo "$page" | grep -qi 'weatherparse'
          ! echo "$page" | grep -qiE 'Fatal error|Parse error|Warning:'

      - name: Container logs on failure
        if: failure()
        run: docker logs wp || true

  publish:
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
