# WeatherParse backup settings. Copy to cron/backup.conf (chmod 600), edit, then run:
#   sudo /opt/weatherparse/cron/backup install-cron     (sets up the schedule below)
#   sudo /opt/weatherparse/cron/backup                  (makes a snapshot now)
#   sudo /opt/weatherparse/cron/backup list             (lists snapshots)
#   sudo /opt/weatherparse/cron/backup restore [NAME]   (restores the newest, or the named, snapshot)
#
# Each snapshot is a dated folder (YYYY-MM-DD_HHMM) holding a database dump and the files. Snapshots are
# incremental: files that did not change since the previous snapshot are hard links, so they take no extra space,
# yet every snapshot can be restored on its own.

BACKUPS_ENABLED=1

# Where to save: local, nfs or smb
BACKUP_TARGET=local

# local: a folder on this machine (or a USB drive mounted here)
BACKUP_LOCAL_DIR=/var/opt/weatherparse/backups

# nfs: needs the nfs-common package. The export must allow this machine with root access (maproot / no_root_squash).
#NFS_EXPORT=nas.example.lan:/mnt/pool/backups/weatherparse
#NFS_OPTIONS=vers=3,hard,timeo=600

# smb: needs the cifs-utils package. Put the login in a separate file (chmod 600) with lines:
#   username=backupuser
#   password=secret
#   domain=WORKGROUP
#SMB_SHARE=//nas.example.lan/backups
#SMB_CREDENTIALS=/root/.weatherparse-smb
#SMB_OPTIONS=vers=3.0

# nfs and smb are mounted here during a backup and unmounted after
MOUNT_POINT=/mnt/weatherparse-backup
# Folder on the share for this station (lets several stations share one export)
#BACKUP_SUBDIR=weatherparse

# How often (used by install-cron): daily, weekly (Sundays) or monthly (the 1st), and the time of day
BACKUP_SCHEDULE=daily
BACKUP_TIME=03:30

# Rotation: how many snapshots to keep (7 daily = one week, 8 weekly = two months, 12 monthly = one year)
KEEP_SNAPSHOTS=7

# 1 = include camera pictures (the big part; after the first snapshot only new pictures take space)
BACKUP_CAM_IMAGES=1
